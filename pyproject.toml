[project]
name = "tool-calling-agent"
version = "0.1.0"
description = "A domain-specific tool-calling agent (FastAPI + LiteLLM + Gemini) on Cloud Run"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "cachetools>=7.2.1",
    "google-cloud-firestore>=2.34.0",
    "python-dotenv>=1.2.3",
]
